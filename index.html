
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hays Test Hub | AI-supported test management</title>
    <meta name="description" content="Hays-internal platform for structured test design, execution and quality evidence." />
    <meta name="theme-color" content="#0A0532" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                slate: {
                  850: '#1e293b',
                  900: '#0f172a',
                  950: '#020617',
                },
                // Hays Brand Tokens (Abschnitt BB) - zentral hier definiert, damit Komponenten
                // z.B. "bg-hays-azure" statt eigener Hex-Werte verwenden koennen.
                hays: {
                  midnight: '#0A0532',
                  azure: '#2173FF',
                  teal: '#06D6A0',
                  'deep-teal': '#0B7A75',
                  orange: '#F7911E',
                  lilac: '#CFB6FF',
                  mint: '#A0F2E4',
                }
              }
            }
          }
        }
    </script>
    <style>
      /*
        Sicherer Font-Stack (Abschnitt DD): keine offiziell freigegebene Hays-Webfont
        im Repository vorhanden -> Arial, danach system-ui/sans-serif als Fallback.
        Es werden bewusst KEINE externen Google-Font-Requests mehr geladen.
      */
      :root {
        --font-family-base: Arial, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-family-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

        /* Semantische Tokens (Abschnitt CC) - Light Mode */
        --color-background-page: #F8F9FC;
        --color-background-surface: #FFFFFF;
        --color-background-subtle: #EEF0F7;
        --color-text-primary: #0A0532;
        --color-text-secondary: #565B75;
        --color-text-inverse: #FFFFFF;
        --color-border-default: #D9DCE8;
        --color-border-strong: #8A8FA3;
        --color-action-primary: #2173FF;
        --color-action-primary-hover: #1A5FE0;
        --color-action-primary-active: #144DBB;
        --color-action-secondary: #EEF0F7;
        --color-focus: #2173FF;
        --color-link: #2173FF;
        --color-success: #0B7A75;
        --color-warning: #F7911E;
        --color-error: #D14343;
        --color-info: #2173FF;
        --color-draft: #8A8FA3;
        --color-blocked: #F7911E;
        --color-review-required: #F7911E;
        --color-confirmed: #0B7A75;
      }

      .dark {
        /* Semantische Tokens - Dark Mode: kein reines Schwarz, sondern Midnight-Blue-Basis */
        --color-background-page: #14162A;
        --color-background-surface: #0A0532;
        --color-background-subtle: #2A2E45;
        --color-text-primary: #FFFFFF;
        --color-text-secondary: #D9DCE8;
        --color-text-inverse: #0A0532;
        --color-border-default: #2A2E45;
        --color-border-strong: #565B75;
        --color-action-primary: #5B9BFF;
        --color-action-primary-hover: #4A8CF5;
        --color-action-primary-active: #3576DE;
        --color-action-secondary: #2A2E45;
        --color-focus: #5B9BFF;
        --color-link: #5B9BFF;
        --color-success: #06D6A0;
        --color-warning: #F7911E;
        --color-error: #F08585;
        --color-info: #5B9BFF;
        --color-draft: #8A8FA3;
        --color-blocked: #F7911E;
        --color-review-required: #F7911E;
        --color-confirmed: #06D6A0;
      }

      body { font-family: var(--font-family-base); }

      /* Sichtbarer Tastaturfokus auf allen interaktiven Elementen (Abschnitt MM, AC-BRAND-09) */
      a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
      textarea:focus-visible, [role="button"]:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

      /* Confetti Animations */
      @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -10px;
        z-index: 9999;
        animation: fall linear forwards;
      }
      
      @keyframes pulse-ring {
        0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      .animate-pulse-ring { animation: pulse-ring 2s infinite; }

      /* PRINT STYLES */
      @media print {
        @page { margin: 1.5cm; }
        body { background-color: white !important; color: black !important; }
        .no-print, header, button, .admin-toolbar { display: none !important; }
        .print-container { 
            box-shadow: none !important; 
            border: none !important; 
            max-width: 100% !important;
            padding: 0 !important;
            background: white !important;
        }
        .glass-panel { background: white !important; border: 1px solid #ddd !important; backdrop-filter: none !important; }
        h1, h2, h3, p, span, div { color: black !important; text-shadow: none !important; }
        .print-expand { display: block !important; height: auto !important; opacity: 1 !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
